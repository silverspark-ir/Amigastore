name: Update AmigaStore Sitemap

on:
  push:
    paths:
      - 'index.html'
      - 'market-ads.json'
      - 'books.json'
      - 'Products.json'
      - 'shop-applications.json'
      - '.github/workflows/update-sitemap-amigastore.yml'

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Sitemap
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > Sitemap-amigastore.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/</loc><changefreq>daily</changefreq><priority>1.0</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/about</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/blog</loc><changefreq>weekly</changefreq><priority>0.7</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/market</loc><changefreq>daily</changefreq><priority>0.9</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/books</loc><changefreq>weekly</changefreq><priority>0.8</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/products</loc><changefreq>weekly</changefreq><priority>0.8</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/discussion</loc><changefreq>daily</changefreq><priority>0.9</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/retro-bazaar</loc><changefreq>weekly</changefreq><priority>0.8</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/emulator</loc><changefreq>monthly</changefreq><priority>0.6</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/bandcamp</loc><changefreq>monthly</changefreq><priority>0.6</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/cart</loc><changefreq>weekly</changefreq><priority>0.5</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/article1</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/article2</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/article3</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/article4</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/article9</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/article10</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>' >> Sitemap-amigastore.xml
          echo '<url><loc>https://amigastore.ir/article11</loc><changefreq>monthly</changefreq><priority>0.7</priority></url>' >> Sitemap-amigastore.xml
          echo '</urlset>' >> Sitemap-amigastore.xml
          cat Sitemap-amigastore.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Sitemap-amigastore.xml
          git diff --staged --quiet || git commit -m "🔄 Auto-update Sitemap-amigastore.xml"
          git push
